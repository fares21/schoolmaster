version: '3.9'

networks:
  schoolmaster-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: /data/postgres
      o: bind
  redis_data:
    driver: local
    driver_opts:
      type: none
      device: /data/redis
      o: bind
  app_storage:
    driver: local
    driver_opts:
      type: none
      device: /data/app
      o: bind
  backup_data:
    driver: local
    driver_opts:
      type: none
      device: /backups
      o: bind
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      device: /var/log/nginx
      o: bind

services:
  # Nginx Web Server
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: schoolmaster-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - schoolmaster-network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # PHP-FPM Application
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        - APP_ENV=production
    container_name: schoolmaster-app
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./src:/var/www/html
      - app_storage:/var/www/html/storage
    networks:
      - schoolmaster-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "php", "artisan", "health:check"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Queue Worker
  queue-worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: schoolmaster-queue-worker
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./src:/var/www/html
      - app_storage:/var/www/html/storage
    networks:
      - schoolmaster-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Schedule Worker (Cron)
  schedule-worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: schoolmaster-schedule-worker
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./src:/var/www/html
      - app_storage:/var/www/html/storage
    networks:
      - schoolmaster-network
    depends_on:
      - redis
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    command: ["php", "artisan", "schedule:work"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: schoolmaster-postgres
    restart: unless-stopped
    user: "999:999"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - backup_data:/backups
    networks:
      - schoolmaster-network
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 80s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - SYS_CHROOT
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache & Session
  redis:
    image: redis:7-alpine
    container_name: schoolmaster-redis
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - schoolmaster-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    sysctls:
      - net.core.somaxconn=1024
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backup Service
  backup:
    image: postgres:16-alpine
    container_name: schoolmaster-backup
    restart: unless-stopped
    volumes:
      - backup_data:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - schoolmaster-network
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - BACKUP_RETENTION_DAYS=30
      - ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY}
    command: |
      sh -c "
      apk add --no-cache postgresql16-client gpg openssl mc &&
      chmod +x /backup.sh &&
      echo '0 */6 * * * /backup.sh' > /etc/crontabs/root &&
      crond -f -l 2
      "
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Redis Commander (Management UI - Internal Only)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: schoolmaster-redis-commander
    restart: unless-stopped
    networks:
      - schoolmaster-network
    environment:
      - REDIS_HOSTS=local:redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
